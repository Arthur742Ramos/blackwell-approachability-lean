      module: "FiniteBlackwellSolution.lean"
      status: "proved"
    - source: "A bounded forcing response gives the finite-time approachability rate"
      lean: "Blackwell.FiniteApproachability.Palomar.finite_game_approachability_bound"
      module: "FiniteBlackwellSolution.lean"
      status: "proved"
    - source: "Mixed Blackwell feasibility yields a causal finite-game strategy"
      lean: "Blackwell.FiniteApproachability.Palomar.finite_game_approachability_of_mixedBlackwell"
      module: "FiniteBlackwellSolution.lean"
      status: "proved"
