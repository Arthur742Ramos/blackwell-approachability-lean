status:
  scope: >-
    Twenty-seven selected statements formalize source-backed finite-dimensional
    results. Both cited families receive fixed-point/impropriety certificates.
    A generic theorem proves that an exact one-way affine action/loss transfer
    with invertible linear parts, translated action and loss coordinates,
    properness on the transformed action image, and equality on Delta_3 times
    the unit loss cube yields an invertible canonical properizer; it cancels
    the loss translation at zero and does not assume Equation (16). For the skew
    simplex family, affine-hyperplane transport yields a nonzero common
    invariant from any canonical properizer, the family has no such invariant,
    and every canonical properizer is singular. It follows that the family has
    no invertible finite affine transfer of the stated form. The source's Equation
    (15), at a full-rank loss basis and simplex basis, is proved to imply
    M_psi = S M_phi in Equation (16), which implies the canonical Equation
    (17). Matrix properness on Delta_3 is equivalent to three action-vertex
    tests, and the skew family is exactly reduced to nine comparator/action
    vertex constraints, with no invertible solution. For the second matrix
    family phi_(a,b)=Id+aA+bB on the coefficient square, the development gives
    a deterministic normalized-kernel fixed-point certificate, witnesses
    impropriety at (1,0), proves an all-ones common invariant, and applies the
    generic extreme-point antipodal theorem at a simplex vertex to rule out a
    canonical properizer. The same direct finite-affine-transfer implication
    rules out transfer witnesses for this family; its four-corner bilinear
    decomposition reduces canonical properness exactly to twelve corner/action
    constraints, which have no invertible solution. The package does not
    formalize the source's complete affine-reduction framework, a regret
    algorithm, rate preservation, minimality, the derivation of Equation (15)
    or a loss basis from arbitrary source sets, the general randomized
    Section 4.4.2 algorithm, or a mathematical-priority claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Pinned Lake dependency; independent Mathlib-only Challenge; named
        theorem axiom audit; exact Comparator and NanoDa replay; hosted
        readiness workflow.
      prompting_notes: >-
        User requested a source-grounded result after a review found an
        earlier classical certificate layer insufficiently substantive.
  notes: "AI assistance was used for proof engineering. The final definitions, statements, and proofs are checked by Lean."
fidelity:
  divergences: >-
    The skew family follows the cited Section 4.4.1 construction after
    identifying q=(a,b,c) in Delta_3 and using phi_q=Id-M_q. The second family
    uses the published matrices A and B with coefficient square [-1,1]^2; its
    fixed point is proved from an explicit homogeneous kernel vector and
    square-completion positivity certificates, including the zero-parameter
    case. The generic selected lemmas formalize affine-normal transport
    (Lemma 4), the extreme-antipodal obstruction (Lemma 5), and finite
    homogeneous and affine one-way action/loss transfers with explicit inverse
    matrices. The affine transfer theorem reconstructs the canonical correction
    from the zero loss and cube basis losses, rather than assuming Equation
    (16). A separate full-rank target-loss basis
    lemma derives M_psi = S M_phi from the source's Equation (15), and another
    derives Equation (17). The remaining selected layers prove the
    action-vertex half of Equation (18) and its exact nine-/twelve-constraint
    specialization for the two source families. This package intentionally
    does not formalize the source's complete affine-reduction definition, the
    general polytope/linear-program/randomized cone-span algorithm, or the
    rate/minimality and set-level span arguments that produce Equation (15).
