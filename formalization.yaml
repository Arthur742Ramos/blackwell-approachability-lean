version: "v0.4"
project:
  name: "Blackwell approachability in Lean"
  description: >-
    A Mathlib-only formalization of a quantitative Euclidean Blackwell
    approachability certificate and its finite-action strategic layer. It proves
    the B/sqrt(T) bound, an additive-error extension, closest-point geometry,
    explicit pure and mixed response strategies against every opponent
    sequence, a Euclidean compact-convex Sion minimax bridge, and the Euclidean
    approachability-to-coordinate-regret reduction with its sharp finite-action
    dimension factor.
  authors: ["Arthur Freitas Ramos"]
  responsible_maintainers: ["Arthur Freitas Ramos"]
  license: "BSD-3-Clause"
classification:
  arxiv: ["cs.GT"]
  msc2020: ["91A26", "46C05"]
sources:
  - title: "An analog of the minimax theorem for vector payoffs"
    authors: ["David Blackwell"]
    id: "https://projecteuclid.org/journals/pacific-journal-of-mathematics/volume-6/issue-1/An-analog-of-the-minimax-theorem-for-vector-payoffs/pjm/1103044269.full"
    type: "paper"
    relationship: "formalizes"
    note: >-
      Original vector-payoff approachability/minimax theorem motivating the
      supporting-half-space condition and convex-target geometry.
    author_endorsement: "not-contacted"
  - title: "Blackwell Approachability and No-Regret Learning are Equivalent"
    authors: ["Jacob Abernethy", "Peter L. Bartlett", "Elad Hazan"]
    id: "https://proceedings.mlr.press/v19/abernethy11b.html"
    type: "paper"
    relationship: "formalizes"
    note: >-
      Modern treatment of the approachability and online-learning connection;
      this package formalizes the deterministic Euclidean/game certificate
      layer, not the full stochastic no-regret equivalence.
    author_endorsement: "not-contacted"
  - title: "Rate-Preserving Reductions for Blackwell Approachability"
    authors: ["Christoph Dann", "Yishay Mansour", "Mehryar Mohri", "Jon Schneider", "Balasubramanian Sivan"]
    id: "https://arxiv.org/abs/2406.07585"
    type: "paper"
    relationship: "formalizes"
    note: >-
      Related reduction perspective motivating the explicit quantitative
      approachability-to-regret conversion; this repository proves the finite
      Euclidean norm conversion itself.
    author_endorsement: "not-contacted"
  - title: "On General Minimax Theorems"
    authors: ["Maurice Sion"]
    id: "https://projecteuclid.org/journals/pacific-journal-of-mathematics/volume-8/issue-1/On-general-minimax-theorems/pjm/1103042507.full"
    type: "paper"
    relationship: "formalizes"
    note: >-
      Source for the compact-convex minimax bridge used to turn pointwise
      feasibility into a uniform response under explicit continuity and
      quasiconvexity hypotheses.
    author_endorsement: "not-contacted"
related_formalizations: []
status:
  scope: >-
    Eleven selected statements cover closest-point/normal-cone geometry, the
    exact and additive-error quantitative bounds, a Euclidean Sion minimax
    bridge, explicit finite pure and mixed game strategy existence and
    convergence against every opponent sequence, and the approachability to
    regret-coordinate conversion. The response premise remains explicit: the
    game theorems do not instantiate the full simplex-valued minimax hypotheses
    for a particular payoff game, model sampled stochastic payoffs, or claim a
    computational algorithm. The examples exercise nonzero cancellation, a
    mixed finite game, a pure finite game, and the dimension-sensitive regret
    conversion.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Pinned Lake dependency; independent Mathlib-only Challenge; named
        theorem axiom audit; exact Comparator and NanoDa replay; hosted
        readiness workflow.
      prompting_notes: "User requested a polished standalone formalization of Blackwell approachability."
  notes: "AI assistance was used for proof engineering. The final definitions, statements, and proofs are checked by Lean."
fidelity:
  divergences: >-
    The geometric and game results are deterministic and use real inner-product
    spaces. The finite-game theorems quantify over every pure opponent action
    sequence and construct a Markov response, but retain the pointwise
    supporting-half-space hypothesis as an input. The Palomar-facing Sion
    statement is a Euclidean compact-convex bridge rather than a full
    finite-simplex instantiation; its underlying implementation is more
    general. The development does not formalize stochastic sampling,
    last-iterate rates, computational complexity, or a practical algorithm
    implementation.
review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    No independent human or Palomar editorial approval is claimed. The eleven
    Challenge holes occur only in the independent statement surface and are
    excluded from status.sorry_count; implementation and Solution contain no
    proof placeholders. Hosted Comparator verification and Palomar editorial
    review remain separate states.
