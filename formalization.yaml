version: "v0.4"
project:
  name: "Irreducible improper phi-regret in Lean"
  description: >-
    A Mathlib-only formalization of two explicit three-action improper
    phi-regret families in Section 4.4.1 of Dann, Mansour, Mohri, Schneider,
    and Sivan (COLT 2025). They are finite counterexample families for the
    paper's rate-preserving linear-reduction program. It proves valid-improper
    certificates, the affine-hyperplane invariant-transport core of Lemma 4,
    the extreme-point antipodal-displacement core of Lemma 5, a direct finite
    one-way affine action/loss-transfer-to-canonical bridge, finite-dimensional
    Equation-(15)-to-(16) and Equation-(16)-to-(17) bridges, and concrete
    Equation-(18) vertex/corner criteria. These mechanisms rule out the
    selected canonical, normalized, finite-loss-basis, homogeneous/affine-transfer, and
    finite-vertex/corner proper reductions for the two cited families.
  authors: ["Arthur Freitas Ramos"]
  responsible_maintainers: ["Arthur Freitas Ramos"]
  license: "BSD-3-Clause"
classification:
  arxiv: ["cs.GT", "cs.LG"]
  msc2020: ["91A26", "68T05"]
research_context:
  question: >-
    When can an improper phi-regret instance be transferred by a
    rate-preserving invertible linear reduction to a proper phi-regret
    instance?
  selected_result: >-
    The two Section 4.4.1 counterexample families exhibit distinct obstructions
    to the source reduction program. The selected Lean surface verifies their
    fixed-point/impropriety certificates, the finite one-way affine action/loss
    transfer implication to canonical properization, canonical and normalized
    obstructions, the finite loss-pairing bridge, and exact finite
    vertex/corner criteria for canonical properness.
  audience: >-
    Researchers in learning theory and game theory working on Blackwell
    approachability, regret transformations, and finite convex games; and
    formalization researchers who need auditable finite-dimensional reduction
    arguments with explicit matrix data.
  boundary: >-
    This is a mechanization of existing COLT 2025 results. It does not claim
    independent mathematical novelty, the paper's complete affine-reduction or
    rate-preservation theory, or its general randomized reduction algorithm.
