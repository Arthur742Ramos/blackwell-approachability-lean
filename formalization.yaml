version: "v0.4"
project:
  name: "Irreducible improper phi-regret in Lean"
  description: >-
    A Mathlib-only formalization of two explicit three-action improper
    phi-regret families in Section 4.4.1 of Dann, Mansour, Mohri, Schneider,
    and Sivan (COLT 2025). It proves valid-improper-family certificates for
    both constructions, the affine-hyperplane invariant-transport core of
    Lemma 4, the extreme-point antipodal-displacement core of Lemma 5, and
    finite-dimensional Equation-(15)-to-(16) and Equation-(16)-to-(17)
    bridges. It then instantiates those mechanisms to rule out invertible
    canonical, normalized, and finite-loss-basis proper reductions for the
    two cited finite-dimensional families.
  authors: ["Arthur Freitas Ramos"]
  responsible_maintainers: ["Arthur Freitas Ramos"]
  license: "BSD-3-Clause"
classification:
  arxiv: ["cs.GT", "cs.LG"]
  msc2020: ["91A26", "68T05"]
sources:
  - title: "Rate-Preserving Reductions for Blackwell Approachability"
    authors:
      ["Christoph Dann", "Yishay Mansour", "Mehryar Mohri", "Jon Schneider",
       "Balasubramanian Sivan"]
    id: "https://proceedings.mlr.press/v291/dann25a.html"
    type: "paper"
    relationship: "formalizes"
    note: >-
      Formalizes both explicit Section 4.4.1 three-action constructions and
      the finite-dimensional canonical-correction arguments appearing in the
      proofs of Lemmas 4 and 5. The source develops a broader reduction
      theory; this package proves a finite full-rank-loss-basis form of the
      source's Equation-(15)-to-(16) step and the normalized
      Equation-(16)-to-(17) implication for its selected results, but does
      not claim the source's preceding general affine-equivalence derivation
      of the canonical normal form.
    author_endorsement: "not-contacted"
  - title: "An analog of the minimax theorem for vector payoffs"
    authors: ["David Blackwell"]
    id: "https://projecteuclid.org/journals/pacific-journal-of-mathematics/volume-6/issue-1/An-analog-of-the-minimax-theorem-for-vector-payoffs/pjm/1103044269.full"
    type: "paper"
    relationship: "background"
    note: >-
      Background for the approachability perspective retained in supporting
      modules; it is not a selected theorem surface for this artifact.
    author_endorsement: "not-contacted"
related_formalizations: []
status:
  scope: >-
    Fifteen selected statements formalize two source-backed finite-dimensional
    results. For the skew simplex family, every mixture has the fixed point
    (c,b,a), an explicit comparator escapes Delta_3, the affine-hyperplane
    transport lemma yields a nonzero common invariant from any invertible
    canonical properizer, the family has no such invariant, and every
    canonical properizer is singular. The source's Equation (15), at a
    full-rank loss basis and simplex basis, is proved to imply
    M_psi = S M_phi in Equation (16), which in turn implies the source's
    canonical Equation (17); the selected skew corollaries rule out every
    invertible normalized and finite-loss-basis proper reduction. For the
    second matrix family
    phi_(a,b)=Id+aA+bB on the coefficient square, the development gives a
    deterministic normalized-kernel fixed-point certificate for every
    parameter, witnesses impropriety at (1,0), proves that the all-ones
    vector is a common invariant, and applies the generic extreme-point
    antipodal theorem at a simplex vertex to rule out an invertible
    canonical properizer and every invertible normalized or finite-loss-basis
    proper reduction. The package does not formalize the source's complete
    affine-reduction framework, a regret algorithm, rate preservation,
    minimality, the derivation of Equation (15) or a loss basis from arbitrary
    source sets, or a mathematical-priority claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Pinned Lake dependency; independent Mathlib-only Challenge; named
        theorem axiom audit; exact Comparator and NanoDa replay; hosted
        readiness workflow.
      prompting_notes: >-
        User requested a source-grounded result after a review found an
        earlier classical certificate layer insufficiently substantive.
  notes: "AI assistance was used for proof engineering. The final definitions, statements, and proofs are checked by Lean."
fidelity:
  divergences: >-
    The skew family follows the cited Section 4.4.1 construction after
    identifying q=(a,b,c) in Delta_3 and using phi_q=Id-M_q. The second family
    uses the published matrices A and B with coefficient square [-1,1]^2; its
    fixed point is proved from an explicit homogeneous kernel vector and
    square-completion positivity certificates, including the zero-parameter
    case. The two generic selected lemmas formalize the canonical-correction
    implications used in the source proofs: affine-normal transport
    (Lemma 4) and the extreme-antipodal obstruction (Lemma 5). A third
    selected lemma uses a full-rank target-loss basis and the simplex basis to
    derive M_psi = S M_phi from the source's Equation (15); a fourth proves
    Equation (16) implies p + S(phi(p)-p), and the concrete no-go results are
    lifted to both finite normalized forms. This package intentionally does
    not formalize the source's full affine-equivalence definition or the
    rate/minimality and set-level span arguments that produce Equation (15).
review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    No independent human or Palomar editorial approval is claimed. The fifteen
    Challenge holes occur only in the independent statement surface and are
    excluded from status.sorry_count; the implementation and Solution contain
    no proof placeholders. Hosted Comparator verification and editorial review
    remain separate states.
