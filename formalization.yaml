    type: "paper"
    relationship: "background"
    note: >-
      Background for the approachability perspective retained in supporting
      modules; it is not a selected theorem surface for this artifact.
    author_endorsement: "not-contacted"
related_formalizations: []
status:
  scope: >-
    Twenty-one selected statements formalize two source-backed finite-dimensional
    results. For the skew simplex family, every mixture has the fixed point
    (c,b,a), an explicit comparator escapes Delta_3, the affine-hyperplane
    transport lemma yields a nonzero common invariant from any invertible
    canonical properizer, the family has no such invariant, and every
    canonical properizer is singular. The source's Equation (15), at a
    full-rank loss basis and simplex basis, is proved to imply
    M_psi = S M_phi in Equation (16), which in turn implies the source's
    canonical Equation (17); matrix properness on Delta_3 is also proved
    equivalent to its three action-vertex tests, and the skew family is
    reduced exactly to nine comparator/action vertex constraints. The
    selected skew corollaries rule out every invertible normalized,
    finite-loss-basis, and nine-vertex proper reduction. For the second matrix family
    phi_(a,b)=Id+aA+bB on the coefficient square, the development gives a
    deterministic normalized-kernel fixed-point certificate for every
    parameter, witnesses impropriety at (1,0), proves that the all-ones
    vector is a common invariant, and applies the generic extreme-point
    antipodal theorem at a simplex vertex to rule out an invertible
    canonical properizer and every invertible normalized or finite-loss-basis
    proper reduction. Its explicit four-corner bilinear decomposition further
    proves that canonical properness is equivalent to twelve corner/action
    constraints, which have no invertible solution. The package does not
    formalize the source's complete affine-reduction framework, a regret
    algorithm, rate preservation, minimality, the derivation of Equation (15)
    or a loss basis from arbitrary source sets, the general randomized
    Section 4.4.2 algorithm, or a mathematical-priority claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Pinned Lake dependency; independent Mathlib-only Challenge; named
        theorem axiom audit; exact Comparator and NanoDa replay; hosted
        readiness workflow.
      prompting_notes: >-
        User requested a source-grounded result after a review found an
        earlier classical certificate layer insufficiently substantive.
  notes: "AI assistance was used for proof engineering. The final definitions, statements, and proofs are checked by Lean."
fidelity:
  divergences: >-
    The skew family follows the cited Section 4.4.1 construction after
    identifying q=(a,b,c) in Delta_3 and using phi_q=Id-M_q. The second family
    uses the published matrices A and B with coefficient square [-1,1]^2; its
    fixed point is proved from an explicit homogeneous kernel vector and
    square-completion positivity certificates, including the zero-parameter
    case. The two generic selected lemmas formalize the canonical-correction
    implications used in the source proofs: affine-normal transport
    (Lemma 4) and the extreme-antipodal obstruction (Lemma 5). A third
    selected lemma uses a full-rank target-loss basis and the simplex basis to
    derive M_psi = S M_phi from the source's Equation (15); a fourth proves
    Equation (16) implies p + S(phi(p)-p), and the concrete no-go results are
    lifted to both finite normalized forms. A fifth and sixth layer prove the
    action-vertex half of Equation (18) and its exact nine-/twelve-constraint
    specialization for the two source families. This package intentionally
    does not formalize the source's full affine-equivalence definition, the
    general polytope/linear-program/randomized cone-span algorithm, or the
    rate/minimality and set-level span arguments that produce Equation (15).
review:
